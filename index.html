<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JobOps V1 — Job Definition Execution Platform feature showcase" />
    <meta name="theme-color" content="#05070d" />
    <title>JOBOPS // Job Definition Execution Platform V1</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong theme. Keep the key in sync with src/theme.tsx.
      try {
        var savedTheme = localStorage.getItem('botops-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
